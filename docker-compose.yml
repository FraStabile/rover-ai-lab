services:
  rover-ai-lab:
    build: .
    ports:
      - "3000:3000"
    environment:
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      JEV_PROTOCOL: ${JEV_PROTOCOL:-systemone}
      # jevos (npm run jev) running on the host machine:
      JEV_BASE_URL: ${JEV_BASE_URL:-http://host.docker.internal:8017}
      JEV_MODEL: ${JEV_MODEL:-jev-latest}
      JEV_TIMEOUT: ${JEV_TIMEOUT:-1000}
      SIMULATION_DEFAULT_HZ: ${SIMULATION_DEFAULT_HZ:-50}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - rover-data:/data
    restart: unless-stopped

  # Optional stand-in for a local Jev model: `docker compose --profile mock-jev up`
  mock-jev:
    profiles: ["mock-jev"]
    build: .
    command: ["npx", "tsx", "scripts/mock-jev-server.ts"]
    environment:
      MOCK_JEV_HOST: 0.0.0.0
    ports:
      - "8017:8017"

volumes:
  rover-data:
